AWSTemplateFormatVersion: '2010-09-09'
Description: AgentCore Runtime for House Agent

Parameters:
  ContainerImageUri:
    Type: String
    Description: ECR image URI for the agent container

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID for authentication

  WebClientId:
    Type: String
    Description: Web client ID (Authorization Code flow - for browser sign-in)

  M2MClientId:
    Type: String
    Description: M2M client ID (Client Credentials flow - for service-to-service)

  KvsStreamName:
    Type: String
    Description: Kinesis Video Stream name

  AthenaDatabase:
    Type: String
    Description: Athena database name

  AthenaOutputBucket:
    Type: String
    Description: S3 bucket for Athena query results

  AgentModelId:
    Type: String
    Description: Bedrock model ID for the agent

  ImageModelId:
    Type: String
    Description: Bedrock model ID for image analysis
  
  McpServerUrl:
    Type: String
    Description: MCP server URL for heater control

  HeaterOAuthMcpUrl:
    Type: String
    Description: Heater MCP OAuth endpoint URL (from workshop frontpage)  

Resources:
  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                Resource: '*'
        - PolicyName: AthenaAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - athena:*
                  - glue:*
                  - s3:*
                Resource: '*'
        - PolicyName: KinesisVideoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kinesisvideo:*
                Resource: '*'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'
        - 'arn:aws:iam::aws:policy/BedrockAgentCoreFullAccess'

  GatewayServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GatewayPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock-agentcore:InvokeGateway
                  - bedrock-agentcore:GetResourceApiKey
                  - bedrock-agentcore:GetResourceOauth2Token
                  - bedrock-agentcore:GetWorkloadAccessToken
                  - bedrock-agentcore:AuthorizeAction
                  - bedrock-agentcore:GetPolicyEngine
                  - bedrock-agentcore:PartiallyAuthorizeActions
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: "*"
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "*"

  McpGateway:
    Type: AWS::BedrockAgentCore::Gateway
    Properties:
      Name: mcp-gateway
      Description: MCP Gateway for external tool integrations
      ProtocolType: MCP
      AuthorizerType: CUSTOM_JWT
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/openid-configuration"
          AllowedClients:
            - !Ref WebClientId
            - !Ref M2MClientId
      RoleArn: !GetAtt GatewayServiceRole.Arn
      ExceptionLevel: DEBUG

  WeatherApiTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt McpGateway.GatewayIdentifier
      Name: weather-api
      Description: Weather API with API key authentication
      TargetConfiguration:
        Mcp:
          OpenApiSchema:
            S3:
              Uri: !Sub "s3://${AthenaOutputBucket}/weather-openapi.json"
              BucketOwnerAccountId: !Ref AWS::AccountId
      CredentialProviderConfigurations:
        - CredentialProviderType: API_KEY
          CredentialProvider:
            ApiKeyCredentialProvider:
              ProviderArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/apikeycredentialprovider/weather-api-key"
              CredentialLocation: HEADER
              CredentialParameterName: "x-api-key"

  HeaterMcpTarget:
    Type: AWS::BedrockAgentCore::GatewayTarget
    Properties:
      GatewayIdentifier: !GetAtt McpGateway.GatewayIdentifier
      Name: heater-mcp
      Description: Heater MCP server with OAuth authentication
      TargetConfiguration:
        Mcp:
          McpServer:
            Endpoint: !Ref HeaterOAuthMcpUrl
      CredentialProviderConfigurations:
        - CredentialProviderType: OAUTH
          CredentialProvider:
            OauthCredentialProvider:
              ProviderArn: !Sub "arn:aws:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:token-vault/default/oauth2credentialprovider/heater-oauth"
              Scopes: []

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: house_agent
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ContainerImageUri
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt RuntimeExecutionRole.Arn
      NetworkConfiguration:
        NetworkMode: PUBLIC
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/openid-configuration'
          AllowedClients:
            - !Ref WebClientId
            - !Ref M2MClientId
      RequestHeaderConfiguration:
        RequestHeaderAllowlist:
          - Authorization
          - X-Amzn-Bedrock-AgentCore-Runtime-Custom-Interrupt-Id
      EnvironmentVariables:
        DISABLE_ADOT_OBSERVABILITY: 'true'
        AWS_REGION: !Ref AWS::Region
        KVS_STREAM_NAME: !Ref KvsStreamName
        ATHENA_DATABASE: !Ref AthenaDatabase
        ATHENA_OUTPUT_BUCKET: !Ref AthenaOutputBucket
        AGENT_MODEL_ID: !Ref AgentModelId
        IMAGE_MODEL_ID: !Ref ImageModelId
        MEMORY_ID: !GetAtt AgentMemory.MemoryId
        MCP_SERVER_URL: !Ref McpServerUrl
        AC_GATEWAY_URL: !Sub "https://${McpGateway.GatewayIdentifier}.gateway.bedrock-agentcore.${AWS::Region}.amazonaws.com/mcp"

  AgentMemory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: house_agent_memory
      Description: Memory for the house agent
      EventExpiryDuration: 30
      MemoryStrategies:
        - UserPreferenceMemoryStrategy:
            Name: UserPreferences
            Description: Learns user preferences like temperature units, favorite food
            Namespaces:
              - /preferences/{actorId}
        - SemanticMemoryStrategy:
            Name: SemanticFacts
            Description: Stores facts about the home and its occupants
            Namespaces:
              - /facts/{actorId}
        - SummaryMemoryStrategy:
            Name: SessionSummaries
            Description: Summarizes past sessions for context
            Namespaces:
              - /summaries/{actorId}/{sessionId}

Outputs:
  RuntimeArn:
    Description: AgentCore Runtime ARN
    Value: !GetAtt AgentRuntime.AgentRuntimeArn

  MemoryId:
    Description: AgentCore Memory ID (for local development)
    Value: !GetAtt AgentMemory.MemoryId

  GatewayEndpoint:
    Description: Gateway MCP Endpoint URL
    Value: !Sub "https://${McpGateway.GatewayIdentifier}.gateway.bedrock-agentcore.${AWS::Region}.amazonaws.com/mcp"  
