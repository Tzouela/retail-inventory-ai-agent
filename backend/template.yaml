AWSTemplateFormatVersion: '2010-09-09'
Description: Retail Inventory AI Agent - AgentCore Runtime Deployment

Parameters:
  ContainerImageUri:
    Type: String
    Description: ECR image URI for the inventory agent container

  UserPoolId:
    Type: String
    Description: Cognito User Pool ID

  WebClientId:
    Type: String
    Description: Cognito Web Client ID

  M2MClientId:
    Type: String
    Description: Cognito M2M Client ID  

  AgentModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID for the agent

  DbHost:
    Type: String
    Description: RDS MySQL endpoint hostname

  DbPort:
    Type: String
    Default: "3306"
    Description: RDS MySQL port

  DbName:
    Type: String
    Default: inventory_db
    Description: Database name

  DbUser:
    Type: String
    Default: inventory_user
    Description: Database username

  DbPassword:
    Type: String
    NoEcho: true
    Description: Database password

Resources:
  RuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: '*'
        - PolicyName: ECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                Resource: '*'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/CloudWatchLogsFullAccess'
        - 'arn:aws:iam::aws:policy/BedrockAgentCoreFullAccess'

  AgentMemory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: inventory_agent_memory
      Description: Memory for the retail inventory AI agent
      EventExpiryDuration: 30
      MemoryStrategies:
        - UserPreferenceMemoryStrategy:
            Name: ManagerPreferences
            Description: Learns manager preferences like order quantities, supplier choices, approval thresholds
            Namespaces:
              - /preferences/{actorId}
        - SemanticMemoryStrategy:
            Name: InventoryFacts
            Description: Stores facts about suppliers, products, store operations
            Namespaces:
              - /facts/{actorId}
        - SummaryMemoryStrategy:
            Name: SessionSummaries
            Description: Summarizes past inventory check sessions
            Namespaces:
              - /summaries/{actorId}/{sessionId}      

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: inventory_agent
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ContainerImageUri
      ProtocolConfiguration: HTTP
      RoleArn: !GetAtt RuntimeExecutionRole.Arn
      NetworkConfiguration:
        NetworkMode: PUBLIC
      AuthorizerConfiguration:
        CustomJWTAuthorizer:
          DiscoveryUrl: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}/.well-known/openid-configuration'
          AllowedClients:
            - !Ref WebClientId
            - !Ref M2MClientId
      RequestHeaderConfiguration:
        RequestHeaderAllowlist:
          - Authorization
          - X-Amzn-Bedrock-AgentCore-Runtime-Custom-Interrupt-Id
      EnvironmentVariables:
        DISABLE_ADOT_OBSERVABILITY: 'true'
        AWS_REGION: !Sub '${AWS::Region}'
        AGENT_MODEL_ID: !Ref AgentModelId
        DB_HOST: !Ref DbHost
        DB_PORT: !Ref DbPort
        DB_NAME: !Ref DbName
        DB_USER: !Ref DbUser
        DB_PASSWORD: !Ref DbPassword
        MEMORY_ID: !GetAtt AgentMemory.MemoryId

Outputs:
  RuntimeArn:
    Description: AgentCore Runtime ARN
    Value: !GetAtt AgentRuntime.AgentRuntimeArn

  Endpoint:
    Description: AgentCore Runtime endpoint URL
    Value: !Sub 'https://bedrock-agentcore.${AWS::Region}.amazonaws.com/runtimes/${AgentRuntime.AgentRuntimeArn}/invocations'

  MemoryId:
    Description: AgentCore Memory ID (for local development)
    Value: !GetAtt AgentMemory.MemoryId    
