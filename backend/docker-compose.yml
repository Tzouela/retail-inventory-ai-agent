services:
  mysql-db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  inventory-agent:
    build: .
    ports:
      - "8081:8080"
    env_file:
      - .env
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_SESSION_TOKEN
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - AC_GATEWAY_URL=${AC_GATEWAY_URL}
    volumes:
      - .:/app
      - ~/.aws:/home/agentuser/.aws:ro
    command: uvicorn app:app --host 0.0.0.0 --port 8080 --reload --no-access-log
    depends_on:
      - mysql-db
    restart: unless-stopped

volumes:
  mysql_data:
